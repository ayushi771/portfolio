<style>
  :root{
    --paper:#f6f3ec;
    --paper-2:#efe9dc;
    --card:#fffdf8;
    --ink:#171310;
    --ink-soft:#5a5346;
    --hl-yellow:#ffd54a;
    --hl-pink:#ff9ac1;
    --hl-mint:#8fe3c0;
    --hl-blue:#8fcbff;
    --hl-lilac:#c9b6ff;
    --hl-orange:#ffb067;
    --radius:0px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .hand{font-family:"Caveat","Space Grotesk",cursive; font-weight:700;}
  .display{font-family:"Archivo Black", ui-sans-serif, sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:"Space Mono", monospace;}

  / ---- browser frame shell (matches reference chrome-bar look) ---- /
  .frame{
    max-width:none;
    margin:0;
    background:var(--paper);
    border:none;
    box-shadow:none;
    background-image:
      radial-gradient(var(--ink-soft) 0.6px, transparent 0.6px);
    background-size:22px 22px;
    background-color:var(--paper);
    background-blend-mode:overlay;
    opacity:1;
    overflow:hidden;
  }
  .chrome-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 16px;
    background:var(--card);
    border-bottom:2px solid var(--ink);
    position:sticky;
    top:0;
    z-index:50;
    flex-wrap:wrap;
  }
  .dots{display:flex; gap:6px; flex:0 0 auto;}
  .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);}
  .dot.red{background:#ff6b57;}
  .dot.yellow{background:#ffd54a;}
  .dot.green{background:#7fd88a;}
  .chrome-nav{
    display:flex; gap:4px; flex:1 1 auto; justify-content:center;
    flex-wrap:wrap;
  }
  .chrome-nav a{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:6px 10px; border:1.5px solid transparent; color:var(--ink-soft);
    text-decoration:none; transition:.15s; white-space:nowrap;
  }
  .chrome-nav a:hover{border-color:var(--ink); color:var(--ink); background:var(--paper-2);}
  .chrome-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .status-dot{width:8px;height:8px;border-radius:50%;}
  .btn-contact{
    font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); padding:7px 14px; border:1.5px solid var(--ink);
    text-decoration:none;
  }

  section{padding:44px 20px;}
  @media(min-width:600px){section{padding:56px 32px;}}
  @media(min-width:768px){section{padding:72px 48px;}}
  @media(min-width:1100px){section{padding:88px 56px;}}

  .eyebrow{font-family:"Caveat"; font-weight:700; font-size:clamp(18px,4vw,22px); color:var(--ink-soft); margin:0;}
  .h-section{font-family:"Archivo Black"; text-transform:uppercase; font-size:clamp(32px,9vw,60px); line-height:.95; margin:4px 0 0;}

  / chips / pills /
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1.5px solid var(--ink); padding:5px 12px;
    font-size:12px; font-weight:700; letter-spacing:.02em;
    background:var(--card);
  }
  .chip.y{background:var(--hl-yellow);} .chip.p{background:var(--hl-pink);}
  .chip.m{background:var(--hl-mint);} .chip.b{background:var(--hl-blue);}
  .chip.l{background:var(--hl-lilac);} .chip.o{background:var(--hl-orange);}

  / sticky note /
  .sticky{border:1.5px solid var(--ink); padding:20px; box-shadow:4px 4px 0 0 var(--ink);}
  .sticky.y{background:var(--hl-yellow);} .sticky.p{background:var(--hl-pink);}
  .sticky.m{background:var(--hl-mint);} .sticky.b{background:var(--hl-blue);}
  .tilt-l{transform:rotate(-1.6deg);} .tilt-r{transform:rotate(1.6deg);}

  / paper card /
  .paper-card{border:1.5px solid var(--ink); background:var(--card); position:relative;}
  .paper-soft{border:1.5px solid var(--ink); background:var(--card);}

  / tape /
  .tape{
    position:absolute; width:64px; height:22px; top:-11px;
    background:rgba(255,213,74,.55); border:1px solid rgba(23,19,16,.25);
  }

  / polaroid /
  .polaroid{border:1.5px solid var(--ink); background:var(--card); padding:10px 10px 30px; box-shadow:5px 5px 0 0 var(--ink);}
  .polaroid figcaption{font-family:"Caveat"; font-weight:700; font-size:20px; text-align:center; margin-top:8px;}

  .avatar-mono{
    aspect-ratio:4/5; width:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--hl-pink), var(--hl-yellow));
    border:1.5px solid var(--ink);
  }
  .avatar-mono span{font-family:"Archivo Black"; font-size:96px; color:var(--ink); opacity:.92;}

  .marker-underline{background-image:linear-gradient(transparent 60%, var(--hl-yellow) 60%); }

  .stamp{
    width:70px;height:70px;border-radius:50%; border:1.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Archivo Black"; font-size:10px; letter-spacing:.03em; line-height:1.15; text-transform:uppercase;
  }

  / browser-chrome mockup used inside project cards /
  .mock{border:1.5px solid var(--ink); background:var(--card); overflow:hidden;}
  .mock-bar{display:flex; gap:5px; padding:7px 9px; border-bottom:1.5px solid var(--ink); background:var(--paper-2);}
  .mock-dot{width:7px;height:7px;border-radius:50%; border:1px solid var(--ink);}
  .mock-body{padding:14px; min-height:150px;}

  .btn-ink{
    display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--ink);
    background:var(--ink); color:var(--paper); padding:11px 20px;
    font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; box-shadow:3px 3px 0 0 var(--hl-yellow); transition:transform .12s;
  }
  .btn-ink:hover{transform:translateY(-2px);}
  .btn-outline{
    display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--ink);
    background:transparent; color:var(--ink); padding:11px 20px;
    font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; box-shadow:3px 3px 0 0 var(--ink); transition:transform .12s;
  }
  .btn-outline:hover{transform:translateY(-2px);}
   .email-hover {
  position: relative;
  padding: 12px 18px;
  border: 1.5px solid var(--ink);
  background: var(--card);
  font-size: 13px;
  font-weight: 700;
  cursor: default;
  overflow: hidden;
  transition: .25s ease;
}

.email-hover .email-address {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  color: var(--paper);
  opacity: 0;
  transform: translateY(100%);
  transition: .25s ease;
  font-size: 12px;
}

.email-hover:hover .email-address {
  opacity: 1;
  transform: translateY(0);
}
  .split-panel{display:grid; grid-template-columns:1fr; border:1.5px solid var(--ink);}
  @media(min-width:900px){.split-panel{grid-template-columns:1.1fr 1fr;}}
  .split-dark{background:var(--ink); color:var(--paper); padding:24px;}
  .split-light{background:var(--card); padding:24px;}
  @media(min-width:768px){.split-dark,.split-light{padding:34px;}}

  .stat-box{border:1.5px solid var(--ink); background:var(--card); padding:14px; text-align:center;}
  .stat-box .val{font-family:"Archivo Black"; font-size:clamp(18px,4vw,26px);}
  .stat-box .lab{font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}

  .tool-badge{
    border:1.5px solid var(--ink); background:var(--card); padding:9px 16px;
    font-family:"Space Mono"; font-size:12px; font-weight:700;
  }
 .tilt-last {
  transform: rotate(0deg) translateX(6px);
}
  input,textarea{font-family:"Space Grotesk"; font-size:14px;}
  textarea:focus,input:focus{outline:none; box-shadow:3px 3px 0 0 var(--hl-yellow);}

  footer{border-top:2px solid var(--ink); padding:18px 20px; text-align:center; font-size:12px; color:var(--ink-soft);}

  img{max-width:100%; height:auto;}

  @media(max-width:480px){
    .stamp{width:56px; height:56px; font-size:9px;}
  }
